<!--
心情追踪器
-->
<!DOCTYPE html>
<html lang="zh-CN">
<body>
  <script>
    const STORAGE_KEY = 'mood_tracker_data';

    const toLocalISO = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    function resolveDate(dateStr) {
      const now = new Date();

      if (!dateStr || dateStr.toLowerCase() === 'today') {
        return toLocalISO(now);
      }

      const lower = dateStr.toLowerCase();
      if (lower === 'yesterday') {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return toLocalISO(d);
      }

      // 直接处理 YYYY-MM-DD 格式
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        return dateStr;
      }

      // 尝试通用日期解析
      const parsed = new Date(dateStr);
      if (!isNaN(parsed.getTime())) {
        return toLocalISO(parsed);
      }

      // 回退
      return toLocalISO(now);
    }

    function getData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : {};
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    window['ai_edge_gallery_get_result'] = async (dataStr) => {
      try {
        const input = JSON.parse(dataStr);
        const action = input.action;
        const date = resolveDate(input.date);
        const allData = getData();
        let resultMessage = "";
        let showDashboard = input.show_dashboard || action === 'get_history';

        if (action === 'log_mood') {
          const score = parseInt(input.score);
          if (isNaN(score) || score < 1 || score > 10) {
            throw new Error("心情分数必须是1到10之间的数字。");
          }

          allData[date] = {
            score: score,
            comment: input.comment || "",
            timestamp: new Date().toISOString()
          };
          saveData(allData);
          resultMessage = `已记录 ${date} 的心情为 ${score}/10${input.comment ? '："' + input.comment + '"' : ''}。`;
        } else if (action === 'get_mood') {
          const entry = allData[date];
          if (entry) {
            resultMessage = `${date} 你的心情是 ${entry.score}/10${entry.comment ? '（' + entry.comment + '）' : ''}。`;
          } else {
            resultMessage = `${date} 没有找到心情记录。`;
          }
        } else if (action === 'get_history') {
          const daysCount = parseInt(input.days) || 7;
          const history = [];
          // 按时间排序（最旧在前）便于趋势分析
          const sortedDates = Object.keys(allData).sort().slice(-daysCount);

          sortedDates.forEach(d => {
            history.push({ date: d, ...allData[d] });
          });

          resultMessage = `以下是你的心情历史（最旧在前，查询于 ${toLocalISO(new Date())}）：\n` +
                          history.map(h => `- ${h.date}: ${h.score}/10 ${h.comment ? '(' + h.comment + ')' : ''}`).join('\n');
        } else if (action === 'delete_mood') {
          if (allData[date]) {
            delete allData[date];
            saveData(allData);
            resultMessage = `已删除 ${date} 的心情记录。`;
          } else {
            resultMessage = `${date} 没有找到可删除的心情记录。`;
          }
        } else if (action === 'export_data') {
          resultMessage = `以下是你的原始心情数据备份（复制并保存此JSON）：\n\n${JSON.stringify(allData, null, 2)}`;
        } else if (action === 'wipe_data') {
          localStorage.removeItem(STORAGE_KEY);
          resultMessage = "所有心情历史已删除。你现在可以重新开始！";
        } else {
          throw new Error(`未知操作: ${action}`);
        }

        const response = {
          result: resultMessage
        };

        if (showDashboard) {
          let url = `dashboard.html?date=${date}`;
          if (input.days) {
            url += `&days=${input.days}`;
          }
          response.webview = { url: url };
        }

        return JSON.stringify(response);

      } catch (e) {
        console.error(e);
        return JSON.stringify({ error: `心情追踪器错误: ${e.message}` });
      }
    };
  </script>
</body>
</html>
