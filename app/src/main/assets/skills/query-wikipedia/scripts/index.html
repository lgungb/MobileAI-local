<!--
百度百科查询技能：调用百度百科公开API获取词条摘要，替代原维基百科（国内不可用）。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百度百科查询</title>
  </head>
  <body>
    <script>
      /**
       * 调用百度百科公开API获取词条摘要。
       * API无需key，返回JSON格式摘要。若API失败则回退到百度百科搜索页。
       * @param {string} topic - 搜索关键词
       */
      async function fetchBaikeSummary(topic) {
        const encodedTopic = encodeURIComponent(topic);
        // 百度百科公开API（无需key）
        const apiUrl = `https://baike.baidu.com/api/openapi/BaikeLemmaCardApi?scope=103&format=json&appid=379020&bk_key=${encodedTopic}&bk_length=800`;
        try {
          const res = await fetch(apiUrl, {
            headers: { 'User-Agent': 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          // 百度百科API返回格式：{errno, errmsg, data: {lemmaTitle, abstract, ...}}
          if (data && data.data && data.data.abstract) {
            let result = `【词条】${data.data.lemmaTitle || topic}\n\n`;
            result += `【摘要】${data.data.abstract}`;
            if (data.data.basicInfo && Array.isArray(data.data.basicInfo)) {
              const infoLines = data.data.basicInfo
                .filter(item => item.name && item.value)
                .map(item => `${item.name}: ${item.value}`)
                .join('\n');
              if (infoLines) result += `\n\n【基本信息】\n${infoLines}`;
            }
            // 限制长度节省上下文
            if (result.length > 2000) {
              result = result.substring(0, 2000) + '\n\n... [内容已截断]';
            }
            return { title: data.data.lemmaTitle || topic, result: result };
          }
          // API返回空，回退到百度百科搜索页
          return {
            webview: {
              iframe: true,
              url: `https://baike.baidu.com/item/${encodedTopic}`,
            },
          };
        } catch (e) {
          console.warn('百度百科API失败，回退到搜索页:', e);
          // API失败时直接显示百度百科搜索页
          return {
            webview: {
              iframe: true,
              url: `https://baike.baidu.com/item/${encodedTopic}`,
            },
          };
        }
      }
      window['ai_edge_gallery_get_result'] = async (data) => {
        try {
          const jsonData = JSON.parse(data);
          if (!jsonData.topic) return JSON.stringify({ error: '未提供查询关键词' });
          const result = await fetchBaikeSummary(jsonData.topic);
          return JSON.stringify(result);
        } catch (e) {
          console.error(e);
          return JSON.stringify({ error: `百度百科查询失败: ${e.message}` });
        }
      };
    </script>
  </body>
</html>
