<!--
学习新事物-卡片生成：使用国内CDN，卡片文字中文化
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 使用系统字体替代Google Fonts（国内不可用） -->
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
    <!-- 使用字节跳动CDN替代cdnjs -->
    <script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-10-M/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div id="qrcode-container" style="display: none"></div>
    <canvas id="card-canvas" style="display: none"></canvas>
    <script>
      window["ai_edge_gallery_get_result"] = async function (data, secret) {
        console.log("[learn-something-new] 脚本启动，数据:", data);
        try {
          // 确保字体加载完成后再测量/绘制文字
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          // 健壮的JSON解析（带回退修复）
          let params = {};
          if (typeof data === "object" && data !== null) {
            params = data;
          } else if (typeof data === "string") {
            const cleanData = data.trim();
            try {
              params = JSON.parse(cleanData);
            } catch (e) {
              console.warn("[learn-something-new] 标准JSON.parse失败，尝试结构修复...");
              try {
                params = JSON.parse(cleanData + "}");
              } catch (e2) {
                try {
                  params = JSON.parse(cleanData + '"}');
                } catch (e3) {
                  console.warn("[learn-something-new] 结构修复失败，回退到正则提取...");
                  const topicMatch = cleanData.match(/"topic"\s*:\s*"([^"\\]*(?:\\.[^"\\]*)*)/i);
                  const descMatch = cleanData.match(/"description"\s*:\s*"([^"\\]*(?:\\.[^"\\]*)*)/i);
                  params.topic = topicMatch ? topicMatch[1].replace(/\\"/g, '"') : "部分数据";
                  params.description = descMatch ? descMatch[1].replace(/\\"/g, '"') : "无法从截断的流中提取描述。";
                }
              }
            }
          }

          const topic = params.topic || "未知主题";
          const description = params.description || "";

          const canvas = document.getElementById("card-canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = 1080;
          canvas.height = 1080;

          // 1. 绘制背景（渐变）
          const gradient = ctx.createLinearGradient(0, 0, 1080, 1080);
          gradient.addColorStop(0, "#FF9A9E");
          gradient.addColorStop(0.5, "#FECFEF");
          gradient.addColorStop(1, "#A1C4FD");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 1080, 1080);

          // 内部白色卡片
          ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
          ctx.shadowBlur = 40;
          ctx.shadowOffsetY = 20;
          ctx.fillStyle = "#FFFFFF";

          // 手动绘制圆角矩形以兼容
          const x = 60, y = 60, w = 960, h = 960, r = 40;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          ctx.fill();
          ctx.shadowColor = "transparent";

          // 2. 绘制"今日新知"标题
          ctx.fillStyle = "#FF6B6B";
          ctx.font = 'bold 32px "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillText("💡 今日新知", 120, 150);

          // 3. 绘制主题
          ctx.fillStyle = "#2D3436";
          ctx.font = 'bold 72px "PingFang SC", "Microsoft YaHei", sans-serif';
          const topicY = 250;
          const nextYAfterTopic = wrapText(ctx, topic, 120, topicY, 840, 85);

          // 4. 绘制描述（防止小模型生成过长文本）
          let clampedDescription = description;
          if (clampedDescription.length > 320) {
            let cutIndex = -1;
            for (let i = 319; i >= 0; i--) {
              if (clampedDescription[i] === '.' || clampedDescription[i] === '!' || clampedDescription[i] === '?' || clampedDescription[i] === '。' || clampedDescription[i] === '！' || clampedDescription[i] === '？') {
                cutIndex = i + 1;
                break;
              }
            }
            if (cutIndex > 0) {
              clampedDescription = clampedDescription.substring(0, cutIndex).trim();
            } else {
              clampedDescription = clampedDescription.substring(0, 317) + "...";
            }
          }
          ctx.fillStyle = "#636E72";
          ctx.font = '42px "PingFang SC", "Microsoft YaHei", sans-serif';
          wrapText(ctx, clampedDescription, 120, nextYAfterTopic + 90, 840, 60);

          // 5. 生成二维码（指向应用主页）
          const container = document.getElementById("qrcode-container");
          container.innerHTML = "";
          try {
            new QRCode(container, {
              text: "https://github.com/google-ai-edge/gallery",
              width: 140,
              height: 140,
              colorDark: "#2D3436",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });
          } catch (qrInitErr) {
            console.error("[learn-something-new] 二维码初始化异常:", qrInitErr);
          }

          // 等待二维码canvas就绪
          const qrCanvas = await new Promise((resolve) => {
            let attempts = 0;
            const check = setInterval(() => {
              const canvas = container.querySelector("canvas");
              if (canvas) {
                clearInterval(check);
                resolve(canvas);
              }
              if (attempts++ > 20) {
                clearInterval(check);
                console.warn("[learn-something-new] 二维码生成超时，跳过二维码绘制。");
                resolve(null);
              }
            }, 50);
          });

          // 6. 绘制页脚（Logo & 二维码）
          const footerY = 920;
          if (qrCanvas) {
            ctx.drawImage(qrCanvas, 830, 820, 140, 140);
          }

          // 绘制应用Logo
          const logoImg = new Image();
          logoImg.src = "../assets/galleryLogo.svg";

          await new Promise((resolve) => {
            logoImg.onload = () => {
              ctx.drawImage(logoImg, 115, footerY - 30, 70, 70);
              resolve();
            };
            logoImg.onerror = () => {
              console.error("[learn-something-new] Logo加载失败:", logoImg.src);
              resolve();
            };
          });

          ctx.fillStyle = "#2D3436";
          ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillText("SeAI 鼓励", 200, footerY);
          ctx.fillStyle = "#B2BEC3";
          ctx.font = '28px "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillText("端侧AI助手", 200, footerY + 40);

          const finalBase64 = canvas.toDataURL("image/jpeg", 0.9);
          console.log("[learn-something-new] 卡片生成成功。");

          return JSON.stringify({
            result: JSON.stringify({
              status: "success",
              message: "卡片生成成功。",
            }),
            image: { base64: finalBase64 },
            error: null,
          });
        } catch (err) {
          console.error("[learn-something-new] 致命未处理异常:", err.message, err);
          return JSON.stringify({ result: null, image: null, error: err.message });
        }
      };

      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        // 中文按字符分割，英文按单词分割
        const chars = text.split('');
        let line = "";
        let currentY = y;

        for (let n = 0; n < chars.length; n++) {
          let testLine = line + chars[n];
          let metrics = context.measureText(testLine);
          let testWidth = metrics.width;
          if (testWidth > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = chars[n];
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, currentY);
        return currentY;
      }
    </script>
  </body>
</html>
