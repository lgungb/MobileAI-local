<!--
学习新事物-查询：使用百度百科API替代维基百科（国内不可用）
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <script>
      window["ai_edge_gallery_get_result"] = async function (data) {
        try {
          let params;
          try {
            params = typeof data === "string" ? JSON.parse(data) : data;
          } catch (e) {
            params = {};
          }

          const topic = params.topic || "未知";
          const encodedTopic = encodeURIComponent(topic);

          // 使用百度百科公开API（无需key）
          const apiUrl = `https://baike.baidu.com/api/openapi/BaikeLemmaCardApi?scope=103&format=json&appid=379020&bk_key=${encodedTopic}&bk_length=600`;
          try {
            const searchRes = await fetch(apiUrl, {
              headers: { 'User-Agent': 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36' }
            });
            if (!searchRes.ok) throw new Error(`HTTP错误! 状态: ${searchRes.status}`);
            const searchData = await searchRes.json();

            if (searchData && searchData.data && searchData.data.abstract) {
              const responsePayload = JSON.stringify({
                result: JSON.stringify({
                  title: searchData.data.lemmaTitle || topic,
                  extract: searchData.data.abstract,
                }),
              });
              console.log("[learn-something-new/query.html] 返回百度百科结果:", responsePayload);
              return responsePayload;
            }
            console.warn("[learn-something-new/query.html] 百度百科查询返回空结构。返回'未找到'。");
            return JSON.stringify({ result: "Not found" });
          } catch (apiErr) {
            console.warn("[learn-something-new/query.html] 百度百科API失败:", apiErr.message);
            return JSON.stringify({ result: "Not found" });
          }
        } catch (err) {
          return JSON.stringify({ error: err.message });
        }
      };
    </script>
  </body>
</html>
